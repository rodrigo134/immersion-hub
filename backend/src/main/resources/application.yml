server:
  port: ${PORT:8080}

spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:immersionhub}
    username: ${DB_USERNAME:immersion}
    password: ${DB_PASSWORD:immersion}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        debug: ${MAIL_DEBUG:true}
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:mySecretKeyForImmersionHub123456789}
  expiration: ${JWT_EXPIRATION:86400000}

app:
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  mail:
    from: ${MAIL_FROM:no-reply@immersionhub.com}
